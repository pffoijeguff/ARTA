name: Linux Bubblewrap isolation integration

on:
  push:
    paths:
      - "src/arta/sandbox.py"
      - "tests/test_sandbox.py"
      - "pyproject.toml"
      - ".github/workflows/sandbox-integration.yml"
  pull_request:
    paths:
      - "src/arta/sandbox.py"
      - "tests/test_sandbox.py"
      - "pyproject.toml"
      - ".github/workflows/sandbox-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-bubblewrap:
    name: Real Linux namespace, network, and host-write isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --version
      - name: Enable Ubuntu unprivileged user namespaces for this ephemeral test runner
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "This runner does not expose the Ubuntu AppArmor user-namespace control; real isolation test cannot be certified here."
            exit 1
          fi
      - name: Install ARTA and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run real-host isolation test (fail closed if namespaces are unavailable)
        env:
          ARTA_RUN_BWRAP_INTEGRATION: "1"
        run: python -m pytest -vv -rs tests/test_sandbox.py::test_real_bubblewrap_blocks_host_writes_and_network
